name: teacher_app
description: "Nepal School Hub (NSHLMS) - Professional Teacher Mobile Application for Nepal Schools & Colleges."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # UI & Design
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  fl_chart: ^0.66.0
  intl: ^0.20.2
  cached_network_image: ^3.3.1
  
  # State Management & Providers
  provider: ^6.1.1
  
  # Networking & Storage
  http: ^1.2.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/NSHLMSTeacher Applogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/NSHLMSTeacher Applogo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/illustrations/
    - assets/icons/
    - assets/icons/3d/
    - assets/icons/3d/navbar/
    - assets/icons/subjects/
